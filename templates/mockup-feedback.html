<!--
  Feedback bar for feature-mockup pages. Never edited by hand inside a
  mockup: scripts/mockup_feedback.py copies everything from the start marker
  to the end marker into the page (this comment stays behind) and replaces the
  config token with the page's JSON config:

    set       decision-set id, e.g. "v3-s1"
    setLabel  the set's name as the user reads it
    mode      "review" | "compare" | "pick"
    options   [{id, label}], in set order
    this      pick only: the option this page shows
    status    "open" | "accepted" | "not-chosen" | "closed"
    chosen    compare + accepted only: the accepted option

  Each option's root element in the mockup carries data-mf-option="<id>".
  The bar posts one comment per send and sends it to Claude. Its first line
  is the grammar feature-mockup parses:
    Mockup feedback · <set> · <action>[ <option>]
  followed by an optional "Note: <text>" line. Actions: accept, choose,
  revise, none, alternatives.

  Offline (opened from disk) or without the comments capability, the bar
  says so and the user replies in chat instead. No external requests.
-->
<!-- mockup-feedback:start -->
<style>
.mf-bar {
  --mf-bg: #f6f7f9;
  --mf-fg: #1a2127;
  --mf-muted: #59646d;
  --mf-line: #d3d9de;
  --mf-field: #ffffff;
  --mf-accent: #2f5fd0;
  --mf-accent-fg: #ffffff;
  --mf-ok: #1d7a4c;
  --mf-warn: #8f5d00;
  --mf-err: #b2322b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .mf-bar {
    --mf-bg: #161b20;
    --mf-fg: #e3e8ec;
    --mf-muted: #98a3ab;
    --mf-line: #2d363e;
    --mf-field: #0f1317;
    --mf-accent: #7ea2f5;
    --mf-accent-fg: #0b1220;
    --mf-ok: #57c48c;
    --mf-warn: #e2ac45;
    --mf-err: #f08077;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] .mf-bar {
  --mf-bg: #161b20;
  --mf-fg: #e3e8ec;
  --mf-muted: #98a3ab;
  --mf-line: #2d363e;
  --mf-field: #0f1317;
  --mf-accent: #7ea2f5;
  --mf-accent-fg: #0b1220;
  --mf-ok: #57c48c;
  --mf-warn: #e2ac45;
  --mf-err: #f08077;
  color-scheme: dark;
}
.mf-bar, .mf-bar * { box-sizing: border-box; }
.mf-bar {
  position: sticky;
  bottom: 0;
  z-index: 2147483000;
  margin: 24px 0 0;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--mf-bg);
  color: var(--mf-fg);
  border-top: 1px solid var(--mf-line);
  box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.08);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  text-align: left;
}
.mf-bar[hidden] { display: none; }
.mf-bar .mf-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.mf-bar .mf-tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--mf-muted);
}
.mf-bar .mf-title { font-weight: 600; }
.mf-bar .mf-context { color: var(--mf-muted); min-width: 0; overflow-wrap: anywhere; }
.mf-bar .mf-toggle {
  margin-left: auto;
  padding: 2px 6px;
  border: 0;
  background: none;
  color: var(--mf-accent);
  font: inherit;
  font-size: 13px;
  text-decoration: underline;
  cursor: pointer;
}
.mf-bar .mf-body { display: flex; flex-direction: column; gap: 8px; }
.mf-bar.mf-collapsed .mf-body { display: none; }
.mf-bar .mf-options { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; border: 0; }
.mf-bar .mf-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border: 1.5px solid var(--mf-line);
  border-radius: 999px;
  background: var(--mf-field);
  cursor: pointer;
}
.mf-bar .mf-chip input { margin: 0; accent-color: var(--mf-accent); }
.mf-bar .mf-chip:has(input:checked) { border-color: var(--mf-accent); }
.mf-bar .mf-chip:has(input:focus-visible) { outline: 2px solid var(--mf-accent); outline-offset: 2px; }
.mf-bar .mf-note {
  width: 100%;
  min-height: 38px;
  max-height: 140px;
  padding: 7px 10px;
  resize: vertical;
  font: inherit;
  color: var(--mf-fg);
  background: var(--mf-field);
  border: 1.5px solid var(--mf-line);
  border-radius: 8px;
}
.mf-bar .mf-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.mf-bar .mf-btn {
  padding: 7px 12px;
  border: 1.5px solid var(--mf-line);
  border-radius: 8px;
  background: transparent;
  color: var(--mf-fg);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.mf-bar .mf-btn.mf-primary { background: var(--mf-accent); border-color: var(--mf-accent); color: var(--mf-accent-fg); }
.mf-bar .mf-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.mf-bar .mf-btn:focus-visible, .mf-bar .mf-toggle:focus-visible, .mf-bar .mf-note:focus-visible {
  outline: 2px solid var(--mf-accent);
  outline-offset: 2px;
}
.mf-bar .mf-channel { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; color: var(--mf-muted); }
.mf-bar .mf-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--mf-muted); }
.mf-bar .mf-channel[data-state="available"] .mf-dot { background: var(--mf-ok); }
.mf-bar .mf-channel[data-state="no_session"] .mf-dot,
.mf-bar .mf-channel[data-state="writers_only"] .mf-dot { background: var(--mf-warn); }
.mf-bar .mf-channel[data-state="blocked"] .mf-dot { background: var(--mf-err); }
.mf-bar .mf-result { margin: 0; font-size: 13px; }
.mf-bar .mf-result[data-kind="ok"] { color: var(--mf-ok); }
.mf-bar .mf-result[data-kind="err"] { color: var(--mf-err); }
.mf-bar .mf-verdict { margin: 0; font-weight: 600; }
[data-mf-option].mf-selected { outline: 3px solid #3b6fe0; outline-offset: 4px; }
</style>
<aside class="mf-bar" id="mf-bar" role="region" aria-label="Mockup feedback" data-uncommentable hidden>
  <div class="mf-head">
    <span class="mf-tag">Feedback</span>
    <span class="mf-title" id="mf-title"></span>
    <span class="mf-context" id="mf-context"></span>
    <button type="button" class="mf-toggle" id="mf-toggle" aria-expanded="true" aria-controls="mf-body">Hide</button>
  </div>
  <div class="mf-body" id="mf-body">
    <p class="mf-verdict" id="mf-verdict" hidden></p>
    <fieldset class="mf-options" id="mf-options" hidden></fieldset>
    <textarea class="mf-note" id="mf-note" maxlength="1500" placeholder="Note for Claude (optional; required to request changes)" aria-label="Note for Claude"></textarea>
    <div class="mf-actions" id="mf-actions"></div>
    <p class="mf-channel" id="mf-channel" data-state="checking">
      <span class="mf-dot" aria-hidden="true"></span>
      <span id="mf-channel-text">Checking whether a Claude session is listening.</span>
      <button type="button" class="mf-toggle" id="mf-recheck" hidden>Check again</button>
    </p>
    <p class="mf-result" id="mf-result" role="status" aria-live="polite" hidden></p>
  </div>
</aside>
<script type="application/json" id="mf-config">{{MOCKUP_FEEDBACK_CONFIG}}</script>
<script>
(function () {
  var cfg;
  try { cfg = JSON.parse(document.getElementById("mf-config").textContent); } catch (e) { return; }
  if (!cfg || !cfg.options || !cfg.options.length) return;

  var PREFIX = "Mockup feedback · ";
  var CHANNEL = {
    checking: "Checking whether a Claude session is listening.",
    available: "A Claude session is listening. Sending wakes it.",
    no_session: "No Claude session is listening. Reply in chat, or check again once the session is back.",
    writers_only: "Only editors of this page can send to Claude. Reply in chat instead.",
    off: "Sending to Claude is not offered here. Reply in chat instead.",
    absent: "Sending works on the published page. Here, reply in chat instead.",
    blocked: "Commenting from this page is turned off. Reply in chat instead."
  };
  var KNOWN = ["available", "writers_only", "no_session", "off"];

  var bar = document.getElementById("mf-bar");
  var titleEl = document.getElementById("mf-title");
  var contextEl = document.getElementById("mf-context");
  var toggleBtn = document.getElementById("mf-toggle");
  var verdictEl = document.getElementById("mf-verdict");
  var optionsEl = document.getElementById("mf-options");
  var noteEl = document.getElementById("mf-note");
  var actionsEl = document.getElementById("mf-actions");
  var channelEl = document.getElementById("mf-channel");
  var channelText = document.getElementById("mf-channel-text");
  var recheckBtn = document.getElementById("mf-recheck");
  var resultEl = document.getElementById("mf-result");

  var comments = null;
  var state = "checking";
  var busy = false;
  var sent = false;
  var buttons = [];

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function label(id) { var o = byId(cfg.options, id); return o ? o.label : id; }
  function root(id) { return document.querySelector('[data-mf-option="' + id + '"]'); }
  function picked() {
    if (cfg.mode !== "compare") return cfg.mode === "pick" ? cfg["this"] : cfg.options[0].id;
    var r = optionsEl.querySelector("input:checked");
    return r ? r.value : null;
  }
  function say(text, kind) {
    resultEl.hidden = !text;
    resultEl.textContent = text || "";
    if (kind) resultEl.setAttribute("data-kind", kind);
    else resultEl.removeAttribute("data-kind");
  }
  function clean(text) {
    return text.replace(/[\u0000-\u0008\u000B-\u001F\u007F]/g, "").trim();
  }

  // Header: the set, and where this page sits in it.
  titleEl.textContent = cfg.setLabel;
  if (cfg.mode === "pick") {
    var others = [];
    var position = 0;
    for (var i = 0; i < cfg.options.length; i++) {
      if (cfg.options[i].id === cfg["this"]) position = i + 1;
      else others.push(cfg.options[i].label);
    }
    contextEl.textContent = "Option " + position + " of " + cfg.options.length + ": " + label(cfg["this"]) +
      ". The others are on their own pages: " + others.join(", ") + ". Choosing here rules them out.";
  } else if (cfg.mode === "compare") {
    contextEl.textContent = cfg.options.length + " options on this page. Pick one.";
  } else {
    contextEl.textContent = label(cfg.options[0].id);
  }

  toggleBtn.addEventListener("click", function () {
    var collapsed = bar.classList.toggle("mf-collapsed");
    toggleBtn.textContent = collapsed ? "Show" : "Hide";
    toggleBtn.setAttribute("aria-expanded", collapsed ? "false" : "true");
  });

  // A settled page shows its verdict and nothing to act on.
  if (cfg.status !== "open") {
    var verdict = {
      accepted: cfg.mode === "compare" ? "Accepted: " + label(cfg.chosen) + "." : "Accepted.",
      "not-chosen": "Not chosen.",
      closed: "Closed. Choices on this page are no longer read."
    }[cfg.status] || "Closed.";
    verdictEl.textContent = verdict;
    verdictEl.hidden = false;
    noteEl.hidden = true;
    channelEl.hidden = true;
    if (cfg.mode === "compare" && cfg.status === "accepted" && root(cfg.chosen)) root(cfg.chosen).classList.add("mf-selected");
    bar.hidden = false;
    return;
  }

  // Compare: one chip per option, outlining its section when picked.
  if (cfg.mode === "compare") {
    var legend = document.createElement("legend");
    legend.className = "mf-tag";
    legend.textContent = "Options";
    optionsEl.appendChild(legend);
    cfg.options.forEach(function (o) {
      var chip = document.createElement("label");
      chip.className = "mf-chip";
      var input = document.createElement("input");
      input.type = "radio";
      input.name = "mf-option";
      input.id = "mf-option-" + o.id;
      input.value = o.id;
      input.addEventListener("change", function () {
        var all = document.querySelectorAll("[data-mf-option]");
        for (var k = 0; k < all.length; k++) all[k].classList.remove("mf-selected");
        var el = root(o.id);
        if (el) {
          el.classList.add("mf-selected");
          var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          el.scrollIntoView({ block: "nearest", behavior: still ? "auto" : "smooth" });
        }
        refresh();
      });
      chip.appendChild(input);
      chip.appendChild(document.createTextNode(o.label));
      optionsEl.appendChild(chip);
    });
    optionsEl.hidden = false;
  }

  // Actions per shape. needsNote: a change request must say what to change.
  var ACTIONS = {
    review: [
      { action: "accept", text: "Looks right", primary: true },
      { action: "revise", text: "Request changes", needsNote: true },
      { action: "alternatives", text: "Show alternatives" }
    ],
    compare: [
      { action: "choose", text: "Send choice", primary: true, needsPick: true },
      { action: "none", text: "None of these", needsNote: true },
      { action: "comment", text: "Comment on this option", needsPick: true }
    ],
    pick: [
      { action: "choose", text: "Choose this one", primary: true },
      { action: "revise", text: "Request changes", needsNote: true },
      { action: "none", text: "None of these", needsNote: true }
    ]
  }[cfg.mode] || [];

  ACTIONS.forEach(function (a) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "mf-btn" + (a.primary ? " mf-primary" : "");
    b.id = "mf-" + a.action;
    b.textContent = a.text;
    b.addEventListener("click", function () {
      if (a.action === "comment") compose();
      else send(a);
    });
    actionsEl.appendChild(b);
    buttons.push({ el: b, spec: a });
  });

  function render() {
    channelEl.setAttribute("data-state", state);
    channelText.textContent = CHANNEL[state] || CHANNEL.off;
    recheckBtn.hidden = !comments || state === "available" || state === "checking" || state === "blocked";
    var pick = picked();
    buttons.forEach(function (b) {
      if (b.spec.action === "comment") {
        b.el.disabled = !comments || !pick;
        b.el.hidden = !comments;
        return;
      }
      b.el.disabled = busy || sent || state !== "available" || (b.spec.needsPick && !pick);
    });
    noteEl.disabled = sent;
  }

  function refresh() {
    if (!comments || state === "blocked") { render(); return; }
    comments.canSendToClaude().then(function (v) {
      return KNOWN.indexOf(v) === -1 ? "off" : v;
    }, function () {
      return "off";
    }).then(function (v) {
      if (comments && state !== "blocked") state = v;
      render();
    });
  }

  function fail(err) {
    var code = err && err.code;
    if (code === "consent_required") {
      say("Not sent. The page was not allowed to comment as you. Your note is kept.", "err");
    } else if (code === "forbidden") {
      state = "blocked";
      say("Not sent. Commenting from this page is turned off.", "err");
    } else if (code === "claude_unavailable") {
      say("Not sent. No Claude session could receive it. Nothing was posted.", "err");
      refresh();
    } else if (code === "rate_limited") {
      say("Not sent. Too many sends in a row. Wait a moment.", "err");
    } else if (code === "invalid" || code === "transform_error") {
      say("Not sent. The note has characters a comment cannot carry.", "err");
    } else if (code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
      comments = null;
      state = "absent";
      say("Not sent. This view cannot post comments from the page.", "err");
    } else {
      say("Not sent. Comments are unavailable right now. Try once more.", "err");
    }
  }

  function send(spec) {
    if (!comments || busy || sent) return;
    var option = spec.action === "choose" || spec.action === "accept" || spec.action === "revise" ? picked() : null;
    if (spec.needsPick && !option) { say("Pick an option first.", "err"); return; }
    var note = clean(noteEl.value);
    if (spec.needsNote && !note) {
      say("Add a note saying what to change.", "err");
      noteEl.focus();
      return;
    }
    var text = PREFIX + cfg.set + " · " + spec.action + (option ? " " + option : "") + (note ? "\nNote: " + note : "");
    var target = root(option || picked() || cfg.options[0].id) || bar.parentNode;
    busy = true;
    say("", null);
    render();
    comments.anchorFor(target).then(function (anchor) {
      return comments.sendToClaude({ anchor: anchor, text: text });
    }).then(function () {
      sent = true;
      say("Sent to Claude: " + spec.text.toLowerCase() + (option ? " (" + label(option) + ")" : "") +
        ". Claude replies in the comment thread and updates this page.", "ok");
    }, fail).then(function () {
      busy = false;
      render();
    });
  }

  function compose() {
    var option = picked();
    var el = option && root(option);
    if (!comments || !el) return;
    comments.openComposer({ element: el }).then(function (r) {
      if (r && r.opened) say("Comment box opened on " + label(option) + ". Write your comment and press Send to Claude.", "ok");
    }, function (err) {
      say(err && err.code === "rate_limited" ? "Too many tries in a row. Wait a moment." : "The comment box is unavailable here.", "err");
    });
  }

  recheckBtn.addEventListener("click", refresh);
  window.addEventListener("focus", refresh);
  bar.hidden = false;
  render();

  var ready = window.claude && typeof window.claude.use === "function"
    ? window.claude.use("comments")
    : Promise.resolve(null);
  ready.then(function (ns) { return ns; }, function () { return null; }).then(function (ns) {
    comments = ns;
    if (!ns) { state = "absent"; render(); return; }
    refresh();
  });
})();
</script>
<!-- mockup-feedback:end -->
